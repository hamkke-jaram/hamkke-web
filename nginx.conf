# 함께자람 웹 + API·AI 프록시. ${SERVER_NAME}, ${API_UPSTREAM}, ${AI_UPSTREAM}은 컨테이너 시작 시 치환된다.
# TLS 인증서는 /etc/nginx/certs 에 마운트한다(hamkke-api/docs/deploy.md 참고).

server {
    listen 80;
    server_name ${SERVER_NAME};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    # 원본 영상이 서버로 오는 경로를 막는 두 번째 관문: 본문 64KB 제한
    # (장면 사진이 지나가는 /ai/ 만 아래에서 2MB로 따로 연다. /api/ 와 나머지는 64KB 그대로다.)
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # MediaPipe WASM 실행에 'wasm-unsafe-eval'이 필요하다. 외부 출처는 허용하지 않는다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        # nginx가 맨 앞단이므로 클라이언트가 보낸 X-Forwarded-For는 버리고 실제 접속 주소만 넘긴다
        # (이어 붙이면 API의 요청 수 제한을 우회할 수 있다).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
    }

    # AI 관찰 기록(hamkke-api/docs/ai-observation.md): 보호자가 동의한 아이의 장면 사진(최대 6장)이 지나가는 유일한 경로.
    # - 본문은 여기만 2MB까지 받는다.
    # - 사진이 디스크에 닿지 않게 한다: 본문 버퍼를 본문 한도와 같게 잡아 임시 파일을 만들지 않고,
    #   요청·응답 버퍼링도 디스크를 쓰지 않게 한다. 접근 로그에는 본문이 남지 않는다(기본 형식).
    # - 모델이 답하는 데 최대 180초가 걸려서 읽기 제한 시간을 200초로 둔다.
    # - AI 서버가 없거나 꺼져 있어도 nginx는 뜬다: 주소를 변수에 담아 요청할 때 찾는다(없으면 이 경로만 502).
    location /ai/ {
        client_max_body_size 2m;
        client_body_buffer_size 2m;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ai_upstream "http://${AI_UPSTREAM}";
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # /api/ 와 같은 이유로 클라이언트가 보낸 X-Forwarded-For는 버리고 실제 접속 주소만 넘긴다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 200s;

        # 관찰 문장이 어디에도 캐시되지 않게 한다. (location에 add_header를 두면 server의 것이 상속되지 않아 다시 적는다.)
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        limit_except GET POST OPTIONS { deny all; }
    }

    # 헬스체크·문서 등 내부 경로는 밖에 열지 않는다
    location /actuator/ { return 404; }

    location /mediapipe/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { application/wasm wasm; application/javascript js; application/octet-stream task; }
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
