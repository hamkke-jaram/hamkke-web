name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 표현 규칙 검수
        run: node scripts/check-expressions.mjs
      - name: 타입 검사·빌드 (분석 모델 내려받기 포함)
        run: npm run build
